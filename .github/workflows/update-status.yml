name: Update Pool Status

on:
  repository_dispatch:
    types: [update_pool_status]

concurrency:
  group: update-pool-status
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply payload (status + history + daily summary)
        env:
          PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: python3 scripts/apply_payload.py

      - name: Commit data files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add status.json history.json daily_summary.json
          git diff --staged --quiet || git commit -m "data: update history.json [skip ci]"
          git push
